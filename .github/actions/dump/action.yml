name: Dump
descriptions: |
  環境変数とGihubコンテクストをログ出力します。
  ワークフローのデバッグに便利です。
inputs:
  enable-context:
    defaut: "true"
    required: false
    descriptions: コンテクストをログ出力するか

outputs:
  dumped-date:
    value: ${{ steps.current.outputs.date }}
    descriptions: ダンプ日時

runs:
  using: composite
  steps:
    - run: printenv | sort
      shell: bash
    - run: echo "${CONTEXT}"
      if: ${{ inputs.enable-context == 'true' }}
      env:
        CONTEXT: ${{ toJSON(github) }}
    - id: current
      run: echo "date=$(date)" >> "${GIHUB_OUTPUT}"
      shell: bash
