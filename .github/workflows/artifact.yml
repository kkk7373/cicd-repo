name: artifacts
on: push
jobs:
  upload-artifacts:
    runs-on: ubuntu-latest
    steps:
      - run: date > date.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uploaded ## アーティファクト名　ダウンロードする際はこれを参照
          path: date.txt ## アップロードするフォルダ、ファイル名を指定可能
          retention: 7

  download-artifact:
    runs-on: ubuntu-latest
    needs: [upload-artifacts]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uploaded
          path: downloaded
      - run: cat downloaded/date.txt
