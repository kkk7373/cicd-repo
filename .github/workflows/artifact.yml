name: artifacts
on: push
jobs:
  upload-artifacts:
    runs-on: ubuntu-latest
    steps:
      - run: date > date.txt
      - use: actions/upload-artifact@v4
        with:
          name: uploaded
          path: date.txt
          retention: 7

  download-artifact:
    runs-on: ubuntu-latest
    need: [upload-artifacts]
    steps:
      - use: actions/download-artifact@v4
        with:
          name: uploaded
          path: downloaded
      - run: cat downloaded/date.txt
