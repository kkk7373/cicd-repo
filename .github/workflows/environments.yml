name: Environments
on:
  workflow_dispatch:
    inputs:
      environment-name:
        type: environment
        default: test
        required: false
        description: Environment name to deploy to
jobs:
  print:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }} ## workflow_dispatchのinputsで指定されたenvironment-nameを参照する
    env:
      USERNAME: ${{vars.ID}}
      PASSWORD: ${{secrets.PASS}}

    steps:
      - run: |
        echo "Username: $USERNAME"
      - run: |
        echo "Password: $PASSWORD"
