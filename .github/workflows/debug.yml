name: Dabug log
on: push
jobs:
  log:
    runs-on: ubuntu-latest
    env:
      PASSEWORD: supersecretsecret
    steps:
      - run: echo "::debug::This is a debug message" ## debugの時のみ有効

      - run: | ## 簡単なプリントデバッグ
          set -x
          date 
          hostname

      - run: |
          echo "::group:: Show environment variables"
          printenv
          echo "::endgroup::"

      - run: echo "::add-mask::$PASSEWORD" ## マスクする
      - run: echo "My password is $PASSEWORD" ## マスクされる
      - run: echo "::error::This is an error message" ## エラーの時のみ有効
      - run: echo "::warning::This is a warning message" ## 警告の時のみ有効
      - run: echo "::notice::This is a notice message" ## 通知の時のみ有効
      - run: |
          echo "## example Title: rocket." >>  ${GITHUB_STEP_SUMMARY}
          echo "- first line" >>  ${GITHUB_STEP_SUMMARY}
          echo "- second line" >>  ${GITHUB_STEP_SUMMARY}
