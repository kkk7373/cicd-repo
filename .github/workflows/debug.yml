name: Dabug log
on: push
jobs:
  log:
    runs-on: ubuntu-latest
    env:
      PASSEWORD: supersecretsecret
    steps:
      - run: echo "::debug::This is a debug message" ## debugの時のみ有効

      - run: | ## 簡単なプリントデバッグ
          set -x
          date 
          hostname

      - run: |
          echo "::group:: Show environment variables"
          printenv
          echo "::endgroup::"

      - run: echo "::add-mask::$PASSEWORD" ## マスクする
      - run: echo "My password is $PASSEWORD" ## マスクされる
