name: Literals
on: push
jobs:
  print:
    runs-on: ubuntu-latest
    env:
      literal-null: ${{ null }}
      literal-num: ${{ 1234 }}
      literal-str: ${{ 'hello' }} #''で囲う必要あり
      literal-str2: world # 省略記法
      literal-arr: ${{ github.event.commits.*.message }} # 配列 オブジェクトフィルター
      contain-modify: ${{ contains(env.literal-arr, 'modify') }} # 配列に特定の値が含まれるか

    steps:
      - run: echo "$contain-modify"
